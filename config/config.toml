# ============================================
# Lanmei 主配置文件（仅含非敏感配置）
# 敏感信息（API Key、数据库密码等）通过环境变量设置
# 环境变量前缀：LANMEI_，例如 LANMEI_AI_LLM_API_KEY
# ============================================

[bot]
nickname = "蓝妹"
super_users = ""
mention_suffix = ""

[bot.gateway]
listen_addr = "0.0.0.0:8080"

[bot.stream]
# 流式段落发送间隔配置（模拟真人打字节奏，避免平台乱序）
# 间隔 = 下一段字数 × typing_speed_ms，再 clamp 到 [min, max]，最后加 ±jitter_pct 抖动
typing_speed_ms = 150    # 打字速度：毫秒/字
min_interval_ms = 1000   # 最小间隔（毫秒）
max_interval_ms = 5000  # 最大间隔（毫秒），0 表示不限
jitter_pct = 0.25        # 间隔抖动比例（0.0-1.0），0 表示无抖动

# ============================================
# 多媒体（RustFS 对象存储 + 视觉理解）
# 视觉模型复用主 LLM 的 base_url / api_key（OpenAI 兼容多模态端点），
# 用于：图片消息的 AI 描述（MediaPass）、表情入库自动打标（/添加表情）。
# 注意：vision_model 留空会回退主对话模型（纯文本模型无法识图），启用视觉必须显式指定。
# ============================================
[bot.media]
vision_enabled = true
vision_model = "deepseek-v4-flash-vision-exp"

[log]
level = "info"
persistent = false
path = "./logs/lanmei.log"
compression = true
max_size = 100
max_age = 30
max_backups = 10

[plugin]
root_dir = "./data/plugins"
# 网易云点歌 API 服务地址（ncm-api），为空时点歌插件不可用
ncm_url = ""
# 点歌结果发送方式（适配不同反向代理工具）：
#   auto = QQ/NapCat 发音乐卡片段，其余平台发文字链接（默认）
#   card = 强制发 OB11 music 段（要求实现支持，如 llonebot）
#   link = 强制发文字链接（最通用）
music_send_mode = "auto"

# 内置业务插件开关（配置驱动注册，无需改代码即可启停）
# 若同名插件已由 Wasm 动态加载，内置注册自动跳过，避免重复
[plugin.builtins]
signin = true      # 签到插件
welcome = true     # 入群欢迎插件
poke = true        # 戳一戳回复插件
three_g = true     # 3G 关键词科普插件
zhaoxin_group = true # 招新群导航插件
rank = true        # 签到积分排行榜插件
cat = true         # 猫猫图片插件
balogo = true      # 蔚蓝档案 LOGO 插件
ping = true        # 连通性测试插件
github_card = true # GitHub 链接卡片插件
music = true       # 网易云点歌插件
sticker = true     # 自定义表情库插件
turtle_soup = true # 海龟汤文字游戏插件
random_beauty = true # 严格安全审核的 Pixiv 随机美图插件

# 随机美图：使用 Random Mage 兼容 API，安全过滤与视觉审核不可关闭
[plugin.random_beauty]
api_base_url = "https://i.mukyu.ru"
timeout_seconds = 18 # 单次插件请求总预算，同时限制上游 HTTP；给 Conduit 留 2 秒收尾
max_attempts = 2 # 获取、下载、文件校验或视觉审核失败时重试，硬上限 2
cooldown_seconds = 30
max_image_bytes = 10485760
min_width = 720
min_height = 720
min_bookmarks = 100
safe_confidence = 0.9
moderation_timeout_seconds = 8

# ============================================
# 管理面板服务
# 认证敏感配置（LANMEI_MANAGER_ADMIN_USERNAME / LANMEI_MANAGER_ADMIN_PASSWORD / LANMEI_MANAGER_SECRET_KEY）
# 仅通过环境变量注入，不写入本文件。
# ============================================
[manager]
enabled = false                    # 管理面板总开关
listen_addr = "0.0.0.0:8090"       # 面板监听地址（生产建议绑定内网/VPN 网段）
trace_retention_days = 7           # conduit_trace 保留天数
access_token_ttl_minutes = 15      # 短期 Access Token 有效期（分钟）
refresh_token_ttl_hours = 168      # 长期 Refresh Token 有效期（小时）
enable_webauthn = true             # WebAuthn(passkey) 总开关
# webauthn_rpid = "lanmei.example.com"  # passkey 要求域名；IP 部署留空则自动回退密码登录
# webauthn_display_name = "Lanmei Manager"
# webauthn_origins = ["https://lanmei.example.com"]
rate_limit_per_minute = 20         # 登录类接口限流（次/分钟/IP）
session_max_per_user = 10          # 单账号最大活跃会话数
max_login_fails = 5                # 连续登录失败锁定阈值
login_lock_minutes = 15            # 登录锁定分钟数
# trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]  # 位于反向代理后时配置

# ============================================
# Prompt 系统路径声明
# ============================================
[prompts]
dir = "./prompts"
config = "./prompts/prompts.toml"

# ============================================
# Skill 系统路径声明
# ============================================
[skills]
dir = "./skills"
config = "./config/skills.toml"

# ============================================
# 编程答题题库路径声明
# 目录结构：quizdata/<语言目录>/*.json（目录名即语言标识）
# 新增语言 = 新增目录 + JSON 文件，无需改代码；文件变更会被热更新。
# ============================================
[quiz]
dir = "./quizdata"

# ============================================
# 知识库系统
# 总开关：enabled = true 后按 bases 列表构建各知识库。
# 召回模式：vector=向量 / fuzzy=模糊 / time=时间（多路命中按 weights 加权合并）。
# ============================================
[knowledge]
enabled = true                     # 知识库总开关
default_recall_modes = ["vector", "fuzzy"]  # 隐式召回与 kb_search 的默认模式
auto_recall_limit = 3               # 每轮对话隐式召回注入的条数

[knowledge.weights]
vector = 1.0                        # 向量召回权重
fuzzy = 0.8                         # 模糊召回权重
time = 0.5                          # 时间召回权重

# ── 本地知识库（PostgreSQL + pgvector + pg_trgm）──
[[knowledge.bases]]
id = "main"
name = "主知识库"
description = "本地文件知识库，docs_dir 下的 Markdown / CSV 自动同步"
provider = "local"
enabled = true
recall_limit = 5                    # 单模式召回上限

[knowledge.bases.config]
docs_dir = "./docs"                 # 知识文件目录（相对程序运行目录），支持 .md 与 .csv
fuzzy_threshold = 0.1               # 模糊召回最低相似度阈值
# CSV 规则表说明：
#   与飞书表格结构同构：A 列=关键词、B 列=回复（C 列匹配形式忽略），每行一条知识。
#   CSV 放入 docs_dir（如 docs/rules.csv）后启动或"重新同步"即自动摄入，
#   检索命中后由 LLM 组织回答（即"AI检索"行为）。
csv_skip_header = true              # 是否跳过 CSV 首行表头

# ── 飞书知识库（Wiki，应用身份访问）──
# 凭据支持 "env:VAR_NAME" 语法从环境变量读取，避免敏感信息入库
