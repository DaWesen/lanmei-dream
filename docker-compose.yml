services:
  # ── PostgreSQL 18（含 pgvector 扩展）──
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lanmei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanmei}
      POSTGRES_DB: ${POSTGRES_DB:-lanmei}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # pg18+ 要求挂载到 /var/lib/postgresql（自动创建版本子目录，支持 pg_upgrade --link）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanmei}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis（Conduit 状态存储）──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── RustFS（S3 兼容对象存储，多媒体缓存）──
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lanmei}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lanmei-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
    volumes:
      - rustfsdata:/data

  # ── 网易云音乐 API（点歌插件依赖，提供 /search 等接口）──
  # 原版 binaryify 镜像稳定且无需 xeapi 加密公钥；增强版 moefurina/ncm-api
  # 依赖动态获取 xeapi 公钥（"xeapi public key is missing"），实测 /search 不可用。
  ncm-api:
    image: binaryify/netease_cloud_music_api:latest
    restart: unless-stopped
    ports:
      - "${NCM_API_PORT:-3000}:3000"

  # ── 蓝妹 Bot ──
  lanmei:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LANMEI_DATABASE_URL: postgres://${POSTGRES_USER:-lanmei}:${POSTGRES_PASSWORD:-lanmei}@postgres:5432/${POSTGRES_DB:-lanmei}?sslmode=disable
      LANMEI_REDIS_ADDR: redis:6379
      LANMEI_BOT_GATEWAY_LISTEN_ADDR: "0.0.0.0:8080"
      LANMEI_BOT_GATEWAY_ACCESS_TOKEN: ${LANMEI_BOT_GATEWAY_ACCESS_TOKEN:-}
      # 网易云点歌 API（ncm-api 服务，覆盖 config.toml 的 plugin.ncm_url）
      LANMEI_PLUGIN_NCM_URL: http://ncm-api:3000
      # 点歌结果发送方式：auto = 发语音（record 段，点击即听，无需签名服务）；
      # 取不到音频时自动降级文字链接。card 需工具支持音乐签名，link 为纯文字。
      LANMEI_PLUGIN_MUSIC_SEND_MODE: auto
      # RustFS 多媒体对象存储
      LANMEI_MEDIA_ENDPOINT: http://rustfs:9000
      LANMEI_MEDIA_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lanmei}
      LANMEI_MEDIA_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lanmei-secret}
      LANMEI_MEDIA_BUCKET: ${LANMEI_MEDIA_BUCKET:-lanmei-media}
      # 管理面板：经 nginx（manager-web）托管前端并反代 /api，故启用内嵌 Fiber 服务
      LANMEI_MANAGER_ENABLED: "true"
      LANMEI_MANAGER_LISTEN_ADDR: "0.0.0.0:8090"
      # 超管凭据与加密主密钥（仅环境变量，不落盘；缺失/过弱时 lanmei 启动失败）
      LANMEI_MANAGER_ADMIN_USERNAME: ${LANMEI_MANAGER_ADMIN_USERNAME:-}
      LANMEI_MANAGER_ADMIN_PASSWORD: ${LANMEI_MANAGER_ADMIN_PASSWORD:-}
      LANMEI_MANAGER_SECRET_KEY: ${LANMEI_MANAGER_SECRET_KEY:-}
    volumes:
      # 配置文件目录（只读）：包含 config.toml 与 skills.toml 等运行时配置
      - ./config:/app/config:ro
      # Prompt 系统（只读）
      - ./prompts:/app/prompts:ro
      # Skill 系统（只读）
      - ./skills:/app/skills:ro
      # 编程答题题库（只读）
      - ./quizdata:/app/quizdata:ro
      # 知识库目录（只读）：Markdown / CSV 文件自动摄入
      - ./docs:/app/docs:ro
    ports:
      - "${LANMEI_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      ncm-api:
        condition: service_started

  # ── 管理面板前端（nginx 托管静态资源，/api 反向代理到 lanmei:8090）──
  # 访问入口：http://<host>:${MANAGER_WEB_PORT:-80}（前端与 /api 同源，CSRF 校验通过）
  manager-web:
    build:
      context: ./manager
    restart: unless-stopped
    ports:
      - "${MANAGER_WEB_PORT:-80}:80"
    depends_on:
      lanmei:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Onebots 网关（统一 IM 平台适配，通过反向 WS 转发事件到蓝妹）──
  onebots:
    image: ghcr.io/lc-cn/onebots:master
    container_name: onebots
    restart: unless-stopped
    volumes:
      - onebots:/data
      - ./config/onebots/config.yaml:/data/config.yaml
    depends_on:
      lanmei:
        condition: service_started

  # ── NapCat（NTQQ 平台 Provider，OneBot 11 方言，通过反向 WS 连接蓝妹）──
  napcat:
    image: mlikiowa/napcat-docker:v4.18.19
    container_name: napcat
    restart: unless-stopped
    environment:
      NAPCAT_GID: ${NAPCAT_QQ_NUMBER:-}
      NAPCAT_UID: ${NAPCAT_QQ_NUMBER:-}
    volumes:
      - napcat:/app/napcat/config
      - ./config/napcat/onebot11.json:/app/napcat/config/onebot11.json:ro
      - ./config/napcat/napcat.json:/app/napcat/config/napcat.json:ro
      - ./config/napcat/napcat_protocol.json:/app/napcat/config/napcat_protocol.json:ro
    depends_on:
      lanmei:
        condition: service_started

volumes:
  pgdata:
  rustfsdata:
  onebots:
  napcat: